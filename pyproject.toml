[project]
name = "medscore"
version = "0.1.0"
description = "Meditative-state scoring from EEG on a 76-subject cohort: per-person calibration, subject-wise validation, time-on-task controls (data not included)"
authors = [{ name = "Ankan Biswas", email = "ankanbiswas0804@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["eegscore @ git+https://github.com/ankanbiswas022/eeg-cognitive-scoring", "pyarrow", "scipy", "pandas", "numpy", "scikit-learn", "lightgbm", "matplotlib", "pyyaml"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/medscore/figure.py" = ["E402"]
